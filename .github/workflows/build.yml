name: build

# GitHub Actions 上でソースからインストーラーをビルドします。
# 「配布物がこのソースコードから作られたこと」を第三者が確認できるようにするための
# ワークフローです（コード署名サービスの要件でもあります）。
# 現時点では署名なしのビルドです。署名を導入したら、このファイルに署名ステップを追加します。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Integrity smoke test
        run: npm run smoke

      - name: Build installer (unsigned)
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create SHA256SUMS
        shell: pwsh
        working-directory: release
        run: |
          $files = Get-ChildItem -File -Filter 'LabNoteChain-Setup-*.exe'
          if (-not $files) { throw 'installer not found' }
          $files | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LabNoteChain-windows
          if-no-files-found: error
          path: |
            release/LabNoteChain-Setup-*.exe
            release/LabNoteChain-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

  # v* タグのときだけ、下書きのリリースを作ります（公開は手動で行います）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LabNoteChain-windows
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$TAG" \
            --generate-notes
